name: Upstream Parity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start upstream SearXNG
        run: |
          mkdir -p configs/searxng-upstream
          docker compose -f docker-compose.upstream.yml up -d
          sleep 15
      - name: Build SearGo
        run: make build
      - name: Start SearGo
        run: |
          ./bin/seargo -config configs/settings.yml &
          sleep 5
      - name: Run parity suite
        run: make test-upstream-report
        continue-on-error: true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: upstream-parity-report
          path: .ody-code/test-reports/upstream-parity-*.json
