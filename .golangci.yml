version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - nilerr
    - prealloc
    - unconvert
    - unparam
  settings:
    govet:
      enable:
        - shadow
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/seargo/seargo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
