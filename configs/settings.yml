server:
  port: 8080
  bind_address: "0.0.0.0"

search:
  safe_search: 1
  autocomplete: "google"
  default_lang: "zh-CN"
  default_category: "general"
  max_results: 10

engines:
  - name: google
    enabled: true
    weight: 1.0
    timeout: 10
  - name: bing
    enabled: true
    weight: 0.8
    timeout: 10
  - name: duckduckgo
    enabled: true
    weight: 0.9
    timeout: 10

outgoing:
  request_timeout: 15
  useragent: "SearGo/1.0"

cache:
  enabled: true
  local_ttl: 30
  redis_ttl: 300
  redis_addr: "localhost:6379"
